<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0b">
  <meta name="description" content="可交互的等轴测台灯：青色灯圈、光锥、笔记本反光和十档亮度调节。">
  <title>A-08 · 等轴测台灯</title>
  <link rel="stylesheet" href="iso-figures-original-source/fonts.css">
  <link rel="stylesheet" href="iso-figures-original-source/styles.css">
  <style>
    :root[data-theme="dark"] {
      --bg:#090a0b; --panel:#090a0b; --edge:#333a3e;
      --line:#899297; --detail:#566066; --body:#141719; --deck:#191c1e;
    }
    body { padding:0; min-height:100dvh; }
    .wrap { max-width:1480px; gap:0; padding:16px 20px 12px; }
    .top { min-height:44px; padding:0 6px; }
    .top .hi { font-size:11px; }
    .top .dot { background:#22d3ee; box-shadow:0 0 10px #22d3ee; }
    .swatches { border-color:#303639; }
    .arrows { display:none; }
    .layout { display:block; }
    #nav { display:none; }
    figure { border:0; border-radius:0; background:transparent; padding:0; gap:0; }
    .cap { padding:3px 8px; color:#7c8488; font-size:10px; }
    #stageHolder { height:min(80dvh,1000px); min-height:610px; aspect-ratio:auto; }
    #stageHolder.glow { background:radial-gradient(ellipse 40% 39% at 44% 53%,rgba(34,211,238,.035),transparent 76%); }
    #stage { height:100%; }
    .bottom { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:5px 8px 0; color:#858d91; font-size:11px; }
    .bottom button { border:1px solid #343b3f; color:#b9c4c7; background:#1b1e20; padding:8px 13px; border-radius:8px; font:inherit; cursor:pointer; }
    .bottom button:hover { border-color:#22d3ee; color:#c8f6ff; }
    .bottom button:focus-visible, .bottom input:focus-visible { outline:2px solid #22d3ee; outline-offset:3px; }
    .controls { display:flex; align-items:center; gap:12px; }
    .controls label { white-space:nowrap; color:#aab3b6; }
    .controls input { width:130px; accent-color:#22d3ee; cursor:pointer; }
    #brightness-value { min-width:32px; color:#b9edf5; font-variant-numeric:tabular-nums; }
    @media(max-width:640px) {
      .wrap { padding:12px 8px; }
      .top { gap:8px; }
      .cap { font-size:9px; }
      #stageHolder { height:65dvh; min-height:430px; }
      .bottom { flex-wrap:wrap; justify-content:center; text-align:center; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
<link rel="stylesheet" href="embedded.css?v=54"></head>
<body>
  <svg class="fx" aria-hidden="true"><defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="9"/></filter>
  </defs></svg>
  <div class="wrap">
    <header class="top">
      <span class="hi"><span class="dot"></span>A-08 / DESK LAMP</span>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="灯光颜色"></div>
      <div class="arrows"><button id="prev" aria-label="上一个物件">←</button><button id="next" aria-label="下一个物件">→</button></div>
    </header>
    <main class="layout">
      <nav id="nav" aria-label="物件列表"></nav>
      <figure>
        <div class="cap"><span class="hi" id="fignum">Fig 8</span><span id="figname">Desk lamp</span></div>
        <div id="stageHolder"></div>
        <div class="bottom">
          <span id="hint">点击台灯底座开关或按 O 键</span>
          <span class="controls">
            <button id="toggle-lamp" type="button">关闭台灯</button>
            <label for="brightness">亮度</label>
            <input id="brightness" type="range" min="0" max="100" step="10" value="70">
            <output id="brightness-value" for="brightness">70%</output>
          </span>
          <span class="hi" id="readout" role="status" aria-live="polite">on · 70%</span>
        </div>
      </figure>
    </main>
  </div>
  <script>
    // Focused local presentation of the saved Iso Figures source.
    // Original work: April Zhu, https://iso-figures.vercel.app/ . See
    // iso-figures-original-source/THIRD_PARTY_NOTICES.md for source details.
    if (location.hash !== '#lamp') location.hash = 'lamp';
    try { localStorage.setItem('iso-accent', 'cyan'); } catch (_) {}
  </script>
  <script src="iso-figures-original-source/app.js"></script>
  <script>
    const lampStage = document.getElementById('stage');
    const lampSwitch = lampStage.querySelector('#lamp-switch');
    const readout = document.getElementById('readout');
    const toggleButton = document.getElementById('toggle-lamp');
    const brightness = document.getElementById('brightness');
    const brightnessValue = document.getElementById('brightness-value');
    function pressLampKey(key) {
      window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles:true }));
    }
    function syncControls() {
      const text = readout.textContent || '';
      toggleButton.textContent = text.startsWith('on') ? '关闭台灯' : '打开台灯';
      const match = text.match(/(\d+)%/);
      if (match) {
        brightness.value = match[1];
        brightnessValue.textContent = `${match[1]}%`;
      }
    }
    lampSwitch.dispatchEvent(new MouseEvent('click', { bubbles:true }));
    toggleButton.addEventListener('click', () => pressLampKey('o'));
    brightness.addEventListener('input', () => {
      const level = Number(brightness.value);
      pressLampKey(level === 100 ? 'm' : String(level / 10));
      brightnessValue.textContent = `${level}%`;
    });
    new MutationObserver(syncControls).observe(readout, { childList:true, characterData:true, subtree:true });
    syncControls();
  </script>
<script src="hit-areas.js"></script></body>
</html>
